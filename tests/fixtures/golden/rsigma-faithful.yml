title: Aggregate of rules setting Sagan bit brute_force
id: d096d8bc-eae7-5535-9ff1-02c0aeca8e2c
name: sagan_xbit_brute_force
status: experimental
description: Synthetic rule. Sagan set the 'brute_force' bit from 1 rule(s); since Sigma cannot express
  an OR between correlated rules, their detections are gathered here. This rule is not meant to alert
  on its own.
author: sagan2sigma
logsource:
  product: syslog
detection:
  s1_selection_1:
    syslog_appname|cased: sshd
  s1_selection_2:
    msg|cased: Failed password
  condition: (s1_selection_1 and s1_selection_2)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: informational
custom_attributes:
  sagan.xbit: brute_force
  sagan.xbit_setters: '1'
