# Vector pipeline generated by sagan2sigma 0.1.0.
#
# It recreates the fields Sagan derives from the raw message so that rules
# converted with --profile vector-enriched have something to match on.
#
# Two values below are placeholders and must be set before this runs:
#   * sources.appliances.address
#   * sinks.rsigma.uri
# Any enrichment_tables below carry a database path placeholder too.
#
# Everything else is ready as-is. Check the pipeline before deploying it:
#
#     vector validate --config vector.yaml
#     vector vrl -i sample-events.json -p transforms/sagan-parse-ip.vrl -o

enrichment_tables:
  sagan_denylist:
    type: mmdb
    # CHANGE ME: an IP denylist as a MaxMind-format MMDB, built from a feed such
    # as SANS DShield with tools/build_denylist_mmdb.py. See docs/PIPELINE.md.
    path: /etc/vector/denylist.mmdb
  sagan_zeek_intel:
    type: mmdb
    # CHANGE ME: a Zeek Intel feed as a MaxMind-format MMDB, built from a feed
    # such as CriticalPathSecurity's with tools/build_denylist_mmdb.py.
    path: /etc/vector/zeek-intel.mmdb

sources:
  appliances:
    type: syslog
    # CHANGE ME: the address and mode your appliances send to.
    address: 0.0.0.0:514
    mode: tcp

transforms:
  sagan_json:
    type: remap
    inputs: [appliances]
    file: transforms/sagan-json.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false
  sagan_parse_ip:
    type: remap
    inputs: [sagan_json]
    file: transforms/sagan-parse-ip.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false
  sagan_denylist:
    type: remap
    inputs: [sagan_parse_ip]
    file: transforms/sagan-denylist.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false
  sagan_zeek_intel:
    type: remap
    inputs: [sagan_denylist]
    file: transforms/sagan-zeek-intel.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false
  sagan_time:
    type: remap
    inputs: [sagan_zeek_intel]
    file: transforms/sagan-time.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false
  sagan_username:
    type: remap
    inputs: [sagan_time]
    file: transforms/username-extraction.vrl
    # A malformed message must not drop the event: the enrichment is
    # best-effort and the detection rules still work without it.
    drop_on_error: false

sinks:
  rsigma:
    type: http
    inputs: [sagan_username]
    # CHANGE ME: your RSigma ingest endpoint.
    uri: http://rsigma:8080/ingest
    encoding:
      codec: json
    # Sigma rules match one event at a time, so events are sent unbatched
    # rather than as a JSON array.
    framing:
      method: newline_delimited
