title: '[JUNIPER-AETAS] VPN Login at suspicious time'
id: cc96be24-c65e-54f1-be0a-9e1f924664dd
status: experimental
description: Converted from Sagan rule SID 5002047 (rev 3), file juniper-aetas.rules.
author: sagan2sigma
logsource:
  product: juniper
detection:
  selection_1:
    appname|cased: Juniper
  selection_2:
    message|re|i: Authentication successful|Login succeeded
  at_days:
    sagan_event_weekday:
      - 1
      - 2
      - 3
      - 4
      - 5
  at_from:
    sagan_event_hhmm|gte: 700
  at_to:
    sagan_event_hhmm|lte: 1800
  condition: selection_1 and selection_2 and (at_days and at_from and at_to)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.successful-user
custom_attributes:
  sagan.sid: '5002047'
  sagan.rev: '3'
  sagan.source_file: juniper-aetas.rules
