title: '[SYMANTEC-EMS] Multiple authentication failures'
id: 70a822f3-6c25-55d7-87d0-30c924758e9b
status: experimental
description: Converted from Sagan rule SID 5001677 (rev 6), file symantec-ems.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    message|contains|cased: failed authentication for internal PGP Desktop
  filter_2:
    message|contains|cased: 'null'
  selection_3:
    appname|cased: pgp/client
  condition: selection_1 and selection_3 and not filter_2
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: low
tags:
  - sagan.classtype.brute-force
custom_attributes:
  sagan.sid: '5001677'
  sagan.rev: '6'
  sagan.source_file: symantec-ems.rules
  rsigma.suppress: 5m
