status: experimental
description: Converted from Sagan rule SID 5005733 (rev 1), file checkpoint-aetas.rules.
author: sagan2sigma
logsource:
  product: checkpoint
detection:
  selection_1:
    message|contains|cased: '[action:"Log In";'
  at_days:
