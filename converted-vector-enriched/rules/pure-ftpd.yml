title: '[PUREFTPD] User logged into an disabled account'
id: 37c87d82-b29d-5a6c-a653-5184a9feaf71
status: experimental
description: Converted from Sagan rule SID 5000414 (rev 4), file pure-ftpd.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    message|re: '[INFO] \S+ is now logged in'
  selection_2:
    message|contains|cased:
      - apache
      - mysql
      - www
      - nobody
      - nogroup
      - portmap
      - named
      - rpc
      - mail
      - ftp
      - shutdown
      - halt
      - daemon
      - bin
      - postfix
      - shell
      - info
      - guest
      - psql
      - user
      - users
      - console
      - uucp
      - lp
      - sync
      - sshd
      - cdrom
      - ossec
      - sagan
  selection_3:
    appname|cased: sshd
  condition: selection_1 and selection_2 and selection_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.successful-user
custom_attributes:
  sagan.sid: '5000414'
  sagan.rev: '4'
  sagan.source_file: pure-ftpd.rules
