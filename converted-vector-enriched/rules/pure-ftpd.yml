title: '[PUREFTPD] FTPCHK3 file accessed by user'
id: a12ae8f5-cd5c-54eb-89f6-9778b3709333
status: experimental
description: Converted from Sagan rule SID 5002952 (rev 4), file pure-ftpd.rules.
references:
  - https://blog.ftptoday.com/ftp-password-stealing-malware
author: sagan2sigma
logsource:
  product: syslog
detection:
