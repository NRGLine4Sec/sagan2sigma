status: experimental
description: Converted from Sagan rule SID 5002886 (rev 5), file courier-bluedot.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    message|contains|cased:
      - LOGOUT
      - DISCONNECTED
  selection_2:
    appname|cased:
      - imapd
      - imapd-ssl
      - courierlogger
  bluedot_hit_1:
    sagan_bluedot_malicious_1: true
  bluedot_hit_2:
    sagan_bluedot_tor_1: true
  bluedot_hit_3:
    sagan_bluedot_honeypot_1: true
  bluedot_hit_4:
    sagan_bluedot_proxy_1: true
  condition: selection_1 and selection_2 and (bluedot_hit_1 or bluedot_hit_2 or bluedot_hit_3 or bluedot_hit_4)
falsepositives:
