---
title: Aggregate of rules setting Sagan bit server.process.wmiprvse
id: e32e05e7-add0-50f7-811d-07275665ace8
name: sagan_xbit_server_process_wmiprvse
status: experimental
description: Synthetic rule. Sagan set the 'server.process.wmiprvse' bit from 1 rule(s); since Sigma cannot
  express an OR between correlated rules, their detections are gathered here. This rule is not meant to
  alert on its own.
author: sagan2sigma
logsource:
  product: syslog
detection:
  s1_selection_1:
    appname|cased: '*Security*'
  s1_selection_2:
    EventID: 4624
  s1_selection_3:
    message|contains|cased: 'Logon Type: 3'
  s1_filter_4:
    message|contains|cased: '$ Account Domain:'
  s1_filter_5:
    message|contains|cased:
      - 'Source Network Address: -'
      - 'Source Network Address: 127.0.0.1'
      - 'Source Network Address: ::1'
  condition: (s1_selection_1 and s1_selection_2 and s1_selection_3 and not (s1_filter_4 or s1_filter_5))
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: informational
custom_attributes:
  sagan.xbit: server.process.wmiprvse
  sagan.xbit_setters: '1'
