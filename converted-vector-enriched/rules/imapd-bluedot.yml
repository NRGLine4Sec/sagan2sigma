title: '[IMAPD-BLUEDOT] Login from a suspicious source'
id: 1e354b8c-2032-5a3e-9b25-658247b8a25e
status: experimental
description: Converted from Sagan rule SID 5002075 (rev 4), file imapd-bluedot.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    appname|cased: imapd*
  selection_2:
    message|contains|cased: LOGIN,
  bluedot_hit_1:
    sagan_bluedot_malicious_1: true
  bluedot_hit_2:
    sagan_bluedot_tor_1: true
  bluedot_hit_3:
    sagan_bluedot_honeypot_1: true
  bluedot_hit_4:
    sagan_bluedot_proxy_1: true
  condition: selection_1 and selection_2 and (bluedot_hit_1 or bluedot_hit_2 or bluedot_hit_3 or bluedot_hit_4)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.successful-user
custom_attributes:
  sagan.sid: '5002075'
  sagan.rev: '4'
  sagan.source_file: imapd-bluedot.rules
