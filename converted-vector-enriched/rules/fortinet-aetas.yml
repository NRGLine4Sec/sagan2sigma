title: '[FORTINET-AETAS] Login accepted at suspicious time'
id: e0391644-84a4-5d73-bdfb-ed2a6c078064
status: experimental
description: Converted from Sagan rule SID 5002043 (rev 4), file fortinet-aetas.rules.
author: sagan2sigma
logsource:
  product: fortinet
detection:
  selection_1:
    message|contains|cased: 32006 type=
  selection_2:
    message|contains|cased: login
  selection_3:
    message|contains|cased:
      - accepted
      - successfully
  at_days:
    sagan_event_weekday:
      - 1
      - 2
      - 3
      - 4
      - 5
  at_from:
    sagan_event_hhmm|gte: 700
  at_to:
    sagan_event_hhmm|lte: 1800
  condition: selection_1 and selection_2 and selection_3 and (at_days and at_from and at_to)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.successful-admin
custom_attributes:
  sagan.sid: '5002043'
  sagan.rev: '4'
  sagan.source_file: fortinet-aetas.rules
