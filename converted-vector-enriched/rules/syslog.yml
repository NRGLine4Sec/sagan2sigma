status: experimental
description: Converted from Sagan rule SID 5000114 (rev 7), file syslog.rules.
author: sagan2sigma
logsource:
  product: linux
  service: syslog
detection:
  selection_1:
    message|re|i: ' fatal |segmentation fault| corrupt '
  filter_2:
    message|contains|cased: 'File Path: '
  filter_3:
    message|contains|cased: '36888: '
  filter_4:
    message|contains: subject
  filter_5:
    message|contains|cased: '36887: '
  filter_6:
    message|contains|cased: Phoenix BIOS
  filter_7:
    message|contains|cased: GET
  filter_8:
    message|contains: heart attack
  filter_9:
    message|contains|cased: alert tcp
  filter_10:
    message|contains|cased: alert http
  filter_11:
    message|contains:
      - abcnews
      - cnn
      - cbsnews
      - foxnews
      - msnbc
  condition: selection_1 and not (filter_2 or filter_3 or filter_4 or filter_5 or filter_6 or filter_7
    or filter_8 or filter_9 or filter_10 or filter_11)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.program-error
custom_attributes:
  sagan.sid: '5000114'
  sagan.rev: '7'
  sagan.source_file: syslog.rules
  rsigma.suppress: 5m
