title: '[TENABLE] An administrator started a session where they impersonated another user'
id: e7bc9332-234b-5926-8177-d8c1a756890b
status: experimental
description: Converted from Sagan rule SID 5010895 (rev 1), file tenable.rules.
references:
  - https://developer.tenable.com/reference/audit-log-events
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    appname|cased: tenable_io_data
  selection_2:
    message|contains|cased: '"action": "session.impersonation.start"'
  condition: selection_1 and selection_2
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.system-event
custom_attributes:
  sagan.sid: '5010895'
  sagan.rev: '1'
  sagan.source_file: tenable.rules
