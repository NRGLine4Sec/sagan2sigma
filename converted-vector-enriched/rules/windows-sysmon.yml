title: '[WINDOWS-SYSMON] Attack on Sysmon - SysmonDrv Registry value set'
id: fdf97b01-ae36-506a-bbd3-1d55e345c991
status: experimental
description: Converted from Sagan rule SID 5007697 (rev 2), file windows-sysmon.rules.
references:
  - https://codewhitesec.blogspot.com/2022/09/attacks-on-sysmon-revisited-sysmonente.html
  - https://github.com/matterpreter/Shhmon
  - https://talesfrominfosec.blogspot.com/2017/12/killing-sysmon-silently.html
author: sagan2sigma
logsource:
  product: windows
detection:
  selection_1:
    appname|cased: '*Sysmon*'
  selection_2:
    EventID:
      - 12
      - 13
  selection_3:
    message|contains: 'EventType: setValue'
  selection_4:
    message|contains: 'Targetobject:'
  selection_5:
    message|contains: \\SysmonDrv\\
  filter_6:
    message|contains|cased: '\\SysmonDrv\\Parameters\\Stop Details: DWORD (0x00000000)'
  filter_7:
    message|contains:
      - sysmon.exe TargetObject
      - sysmon64.exe TargetObject
  condition: selection_1 and selection_2 and selection_3 and selection_4 and selection_5 and not (filter_6
    or filter_7)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.suspicious-command
custom_attributes:
  sagan.sid: '5007697'
