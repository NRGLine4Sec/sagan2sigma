title: '[SCREENCONNECT] Suspicious File Transferred to Client'
id: f1c5b816-d4fe-54eb-a5eb-d3a5aa13ab1a
status: experimental
description: Converted from Sagan rule SID 5015124 (rev 1), file screenconnect.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    appname|cased: screenconnect-restful-api_data
  selection_2:
    message|contains|cased:
      - '"EventType":83'
      - '"EventType":84'
      - '"EventType":86'
  selection_3:
    message|contains|cased:
      - .exe"},
      - .bat"},
      - .dll"},
      - .ps1"},
  selection_4:
    message|re: \"Data\x22\:\x22[a-zA-Z0-9\-\.]+\.(?:exe|bat|dll|ps1)\x22
  condition: selection_1 and selection_2 and selection_3 and selection_4
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.suspicious-command
custom_attributes:
  sagan.sid: '5015124'
  sagan.rev: '1'
  sagan.source_file: screenconnect.rules
  sagan.metadata: created_at=2024_09_03,updated_at=2024_10_10
