title: '[BOMGAR] Beyond Trust Login After Brute Force (correlated with brute_force)'
id: 0b26e013-e357-588f-8215-baa1de40d996
status: experimental
description: Reconstruction of the Sagan 'brute_force' bit. The window comes from the expire time declared
  by the rules that set the bit.
correlation:
  type: temporal_ordered
  rules:
    - sagan_xbit_brute_force
    - sagan_5014806
  group-by:
    - sagan_ip_1
  timespan: 1d
level: medium
