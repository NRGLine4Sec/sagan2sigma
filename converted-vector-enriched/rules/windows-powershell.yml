title: '[WINDOWS-POWERSHELL] Powershell History Cleared Detected [1/4]'
id: f834684a-7a92-59ee-af13-336ab358f1db
status: experimental
description: Converted from Sagan rule SID 5005747 (rev 1), file windows-powershell.rules.
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/powershell
author: sagan2sigma
logsource:
  product: windows
detection:
  selection_1:
