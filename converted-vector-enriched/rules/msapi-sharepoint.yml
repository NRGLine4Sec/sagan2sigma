  product: m365
detection:
  selection_1:
    sagan_raw|contains|cased: ClientIP
  selection_2:
    Workload|cased: SharePoint
  selection_3:
    Operation|cased: FileAccessed
  filter_4:
    UserId|cased: app@sharepoint
  filter_5:
    UserAgent|contains|cased: ODMTADemand-Transform_Thumbnail
  filter_6:
    IsManagedDevice|cased: 'true'
  filter_7:
    SourceRelativeUrl|cased: User Photos/Profile Pictures
  filter_8:
    ApplicationDisplayName|cased:
      - Power BI
      - OneNoteLegacyClient
  filter_9:
    SourceFileExtension|cased:
      - svg
      - gif
      - tiff
      - webp
      - bmp
      - tif
      - ico
      - heic
      - heif
  filter_10:
    SourceRelativeUrl|contains:
      - User Photos
      - Profile Pictures
  condition: selection_1 and selection_2 and selection_3 and not (filter_4 or filter_5 or filter_6 or
    filter_7 or filter_8 or filter_9 or filter_10)
falsepositives:
