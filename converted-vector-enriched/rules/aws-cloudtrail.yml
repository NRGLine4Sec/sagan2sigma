title: '[AWS-CLOUDTRAIL] Find Metric Keywords'
id: d62ea093-9788-58a4-9904-43d6b1d8a024
status: experimental
description: Converted from Sagan rule SID 5014182 (rev 2), file aws-cloudtrail.rules.
references:
  - https://aws.amazon.com/blogs/security/anatomy-of-a-ransomware-event-targeting-data-in-amazon-s3/
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/metrics-dimensions.html
author: sagan2sigma
logsource:
  product: aws
detection:
  selection_1:
    appname|cased: '*.amazonaws.com'
  selection_2:
    message|contains|cased:
      - eventName":"BucketSizeBytes"
      - eventName":"GetRequests"
      - eventName":"PutRequests"
      - eventName":"DeleteRequests"
      - eventName":"ListRequests"
      - eventName":"BytesDownloaded"
  filter_3:
    message|contains|cased: '"mfaAuthenticated": "true"'
  condition: selection_1 and selection_2 and not filter_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - attack.t1082
  - attack.ta0007
  - sagan.classtype.discovery
custom_attributes:
  sagan.sid: '5014182'
  sagan.rev: '2'
  sagan.source_file: aws-cloudtrail.rules
  sagan.metadata: deployment=Server,created_at=2023_01_20,updated_at=2024_05_21
