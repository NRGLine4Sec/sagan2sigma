title: '[DARKTRACE] Potential Malicious traffic detection'
id: 81c0c0f0-c67b-5d2a-b2a9-7150941aac1c
status: experimental
description: Converted from Sagan rule SID 5005840 (rev 4), file darktrace.rules.
author: sagan2sigma
logsource:
  product: darktrace
detection:
  selection_1:
    appname|cased: darktrace
  selection_2:
    message|re: ^.+}$
  filter_3:
    message|contains|cased:
      - 'Anomalous Connection::'
      - 'Anomalous File::'
      - 'Anomalous Server Activity::'
      - 'Antigena::'
      - 'Compliance::'
      - 'Compromise::'
      - 'Device::'
      - 'Infrastructure::'
      - 'System::'
      - 'Unusual Activity::'
      - 'User::'
  filter_4:
    message|contains|cased: config_alert_name
  condition: selection_1 and selection_2 and not (filter_3 or filter_4)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.bad-unknown
custom_attributes:
  sagan.sid: '5005840'
  sagan.rev: '4'
  sagan.source_file: darktrace.rules
