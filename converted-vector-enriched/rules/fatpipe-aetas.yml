status: experimental
description: Converted from Sagan rule SID 5002041 (rev 2), file fatpipe-aetas.rules.
author: sagan2sigma
logsource:
  product: fatpipe
detection:
  selection_1:
    message|contains|cased: 'Login: Success'
  selection_2:
    appname|cased: xtremed
  at_days:
    sagan_event_weekday:
      - 1
      - 2
      - 3
      - 4
      - 5
  at_from:
