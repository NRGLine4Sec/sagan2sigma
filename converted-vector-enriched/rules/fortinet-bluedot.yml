title: '[FORTINET-BLUEDOT] SSH traffic detected from suspicious source'
id: 63b30ac3-8e5d-5766-b2ee-4fde1eedf080
status: experimental
description: Converted from Sagan rule SID 5002884 (rev 4), file fortinet-bluedot.rules.
author: sagan2sigma
logsource:
  product: fortinet
detection:
  selection_1:
    message|contains|cased: ' service=SSH '
  filter_2:
    message|contains|cased: duration=0 sentbyte=0 rcvdbyte=0
  bluedot_hit_1:
    sagan_bluedot_malicious_1: true
  bluedot_hit_2:
    sagan_bluedot_tor_1: true
  bluedot_hit_3:
    sagan_bluedot_honeypot_1: true
  bluedot_hit_4:
    sagan_bluedot_proxy_1: true
  condition: selection_1 and not filter_2 and (bluedot_hit_1 or bluedot_hit_2 or bluedot_hit_3 or bluedot_hit_4)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.suspicious-traffic
