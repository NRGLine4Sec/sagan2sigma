title: '[FORTINET-BLUEDOT] Login accepted from suspicious source'
id: 17af4320-7c2a-58f6-89b8-8da92d4c314e
status: experimental
description: Converted from Sagan rule SID 5002881 (rev 5), file fortinet-bluedot.rules.
author: sagan2sigma
logsource:
  product: fortinet
detection:
  selection_1:
    message|contains|cased: 32006 type=
  selection_2:
    message|contains|cased: login
  selection_3:
    message|contains|cased:
      - accepted
      - successfully
  bluedot_hit_1:
    sagan_bluedot_malicious_1: true
  bluedot_hit_2:
    sagan_bluedot_tor_1: true
  bluedot_hit_3:
    sagan_bluedot_honeypot_1: true
  bluedot_hit_4:
    sagan_bluedot_proxy_1: true
  condition: selection_1 and selection_2 and selection_3 and (bluedot_hit_1 or bluedot_hit_2 or bluedot_hit_3
    or bluedot_hit_4)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.successful-admin
custom_attributes:
  sagan.sid: '5002881'
  sagan.rev: '5'
  sagan.source_file: fortinet-bluedot.rules
