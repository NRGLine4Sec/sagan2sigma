name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests tools
      - name: ruff format
        run: ruff format --check src tests tools
      - name: mypy
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # cti brings mmdb-writer + maxminddb so the denylist MMDB build test runs
      # here rather than skipping; without it the build path goes unexercised.
      - run: pip install -e ".[dev,cti]"
      # No coverage floor here on purpose. This job has neither rsigma nor
      # Vector, so the engine-backed overlap and VRL tests skip and the measured
      # figure would say "uncovered" about code that is in fact covered, just not
      # from this environment. The floor is enforced in the differential job,
      # which has the engine, by its final step.
      - name: Unit, property, golden and integration tests
        run: pytest

  minimum-versions:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Installing the declared floor rather than the latest release. Without
      # this job a wrong lower bound ships silently and only breaks for users.
      - run: pip install -e ".[dev]" "pysigma==1.1.0" "pyyaml==6.0.3"
      - run: pytest -q

  packaging:
    name: Wheel builds and installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
      - name: Bundled profiles and catalog must be present in the wheel
        run: |
          /tmp/check/bin/python -c "
          from sagan2sigma.mapping.context import load_catalog, load_profile
          assert load_profile('rsigma-syslog').field('message') == '_raw'
          assert load_catalog().resolve('ssh.rules').logsource
          print('package data OK')
          "
      - run: /tmp/check/bin/sagan2sigma --version

  vrl:
    name: VRL transforms under Vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # mmdb-writer builds the denylist / Zeek-intel MMDBs the intel transforms
      # read, so the enrichment path can be tested end to end.
      - run: pip install -e ".[dev,cti]"
      - name: Install Vector
        run: |
          curl -sL --proto '=https' --tlsv1.2 \
            https://packages.timber.io/vector/0.39.0/vector-0.39.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /tmp
          echo "/tmp/vector-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      # Free IP-to-country databases, one per schema, so the provider-agnostic
      # geoip transform is exercised against both the nested (DB-IP) and the
      # top-level (IPLocate) record layout. Best-effort: a provider that fails to
      # download simply leaves its test skipped rather than failing the build.
      - name: Fetch free GeoIP databases
        run: |
          mkdir -p /tmp/geoip
          # DB-IP IP-to-Country Lite (CC BY 4.0). New file each month; fall back
          # to the previous month early in a month before the new one is posted.
          for m in "$(date -u +%Y-%m)" "$(date -u -d '1 month ago' +%Y-%m)"; do
            if curl -fsSL "https://download.db-ip.com/free/dbip-country-lite-${m}.mmdb.gz" \
                 | gunzip > /tmp/geoip/dbip.mmdb 2>/dev/null && [ -s /tmp/geoip/dbip.mmdb ]; then
              echo "SAGAN2SIGMA_GEOIP_MMDB_DBIP=/tmp/geoip/dbip.mmdb" >> "$GITHUB_ENV"
              break
            fi
          done
          # IPLocate ip-to-country (CC BY-SA 4.0), from the Git-LFS media mirror.
          if curl -fsSL "https://media.githubusercontent.com/media/iplocate/ip-address-databases/main/ip-to-country/ip-to-country.mmdb" \
               -o /tmp/geoip/iplocate.mmdb && [ -s /tmp/geoip/iplocate.mmdb ]; then
            echo "SAGAN2SIGMA_GEOIP_MMDB_IPLOCATE=/tmp/geoip/iplocate.mmdb" >> "$GITHUB_ENV"
          fi
      # The vector-enriched profile promises fields the VRL has to create. This
      # job is what stops that promise from drifting: it executes the transforms
      # and checks the addresses they extract against Sagan's own semantics, and
      # the country enrichment against real data from both providers.
      - name: Run the bundled VRL against Vector
        run: pytest tests/integration/test_vector_vrl.py -v

  differential:
    name: Differential semantics against rsigma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: dtolnay/rust-toolchain@stable
      # Swatinem/rust-cache used to sit here and is deliberately gone. It keys
      # its cache on the Cargo workspace of the checked-out repository, and this
      # repository is Python: with no Cargo.toml every run failed with "cargo
      # failed with exit code 101", cached nothing, and left a misleading Error
      # in the log people read when the differential breaks. Caching the built
      # binary instead was considered and rejected: rsigma is installed
      # unpinned, so a cache hit would silently keep testing against a stale
      # engine, which is the one thing this job exists to prevent.
      - name: Install the rsigma engine
        # The daemon feature carries the syslog input parser, without which the
        # harness cannot present events in the two shapes RSigma actually sees.
        run: cargo install --locked --features daemon rsigma
      - name: Fetch the upstream Sagan rule corpus
        run: git clone --depth 1 https://github.com/quadrantsec/sagan-rules.git /tmp/sagan-rules
      # This is the only test that asks whether a converted rule *behaves* like
      # the original. Both sides are computed independently: the Sagan side by a
      # reference evaluator written from the engine C source, the Sigma side by
      # the real rsigma binary. It is what caught the envelope field naming
      # defect that silently broke a quarter of the corpus.
      - name: Differential semantics
        env:
          SAGAN_RULES_DIR: /tmp/sagan-rules
          SAGAN2SIGMA_DIFF_SAMPLE: "99999"
        run: pytest tests/differential -v
      # The coverage floor lives here, not in the version matrix, because this is
      # the only job with rsigma on PATH: the overlap analysis is engine-backed,
      # so without the engine a third of it cannot execute and the figure
      # measures the environment rather than the tests. SAGAN_RULES_DIR is left
      # unset so the corpus-scale tests, already run above, are not repeated.
      - name: Full suite with the engine present, and the coverage floor
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml
          coverage report --fail-under=90

  corpus:
    name: Upstream corpus invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fetch the upstream Sagan rule corpus
        run: git clone --depth 1 https://github.com/quadrantsec/sagan-rules.git /tmp/sagan-rules
      # These assert the invariants that only a real corpus can exercise:
      # every line parses, every emitted document validates, identifiers stay
      # unique, no new upstream keyword goes unhandled and the conversion rate
      # does not regress.
      - name: Corpus invariants
        env:
          SAGAN_RULES_DIR: /tmp/sagan-rules
        run: pytest tests/integration/test_corpus.py -v
      - name: End-to-end run with a conversion-rate gate
        run: |
          sagan2sigma /tmp/sagan-rules \
            --output /tmp/converted \
            --min-rate 78 \
            --fail-on-validation
      - name: The enriched profile must recover the positional correlations
        run: |
          sagan2sigma /tmp/sagan-rules \
            --output /tmp/converted-enriched \
            --profile vector-enriched \
            --min-rate 81 \
            --fail-on-validation
      - uses: actions/upload-artifact@v4
        with:
          name: conversion-report
          path: |
            /tmp/converted/CONVERSION-REPORT.md
            /tmp/converted/conversion-report.json

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, minimum-versions, packaging, vrl, differential, corpus]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
