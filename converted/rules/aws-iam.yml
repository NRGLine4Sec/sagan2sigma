title: '[AWS-IAM] Identity and Access Management Discovery Command Event Detected (ListUsers)'
id: 1c5d6df4-c14e-5ceb-84d5-471a2974d987
status: experimental
description: Converted from Sagan rule SID 5015086 (rev 2), file aws-iam.rules.
references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_Operations.html
author: sagan2sigma
logsource:
  product: aws
detection:
  selection_1:
    appname|cased: iam.amazonaws.com
  selection_2:
    _raw|contains|cased: 'eventName": "ListUsers'
  filter_3:
    _raw|contains|cased: '"mfaAuthenticated": "true"'
  filter_4:
    _raw|contains|cased: AWSReservedSSO_AWSAdministratorAccess
  filter_5:
    _raw|contains|cased: AWSServiceRole
  condition: selection_1 and selection_2 and not (filter_3 or filter_4 or filter_5)
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - attack.ta0007
  - sagan.classtype.system-event
custom_attributes:
  sagan.sid: '5015086'
  sagan.rev: '2'
  sagan.source_file: aws-iam.rules
