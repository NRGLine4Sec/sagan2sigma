title: '[WINDOWS-POWERSHELL] Powershell History Cleared Detected [1/4]'
id: c696c46d-77a8-51a9-adf7-908b25988f9b
status: experimental
description: Converted from Sagan rule SID 5009305 (rev 1), file azureEventHub_windows-powershell.rules.
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/powershell
author: sagan2sigma
logsource:
  product: windows
detection:
  selection_1:
    appname|cased: '*PowerShell*'
  selection_2:
    _raw|contains|cased: HistorySave
  selection_3:
    _raw|contains|cased: del (Get-PSReadlineOption).HistorySavePath
  condition: selection_1 and selection_2 and selection_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.suspicious-command
custom_attributes:
  sagan.sid: '5009305'
  sagan.rev: '1'
  sagan.source_file: azureEventHub_windows-powershell.rules
  sagan.metadata: created_on=2022_11_22,old_sid=5005747
