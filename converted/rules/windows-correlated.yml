title: '[WINDOWS-CORRELATED] WMIC Command Detected [Set Flexbit]'
id: 1a08d333-215e-5f5b-b5d0-e5d37c314a2b
status: experimental
description: Converted from Sagan rule SID 5003385 (rev 7), file windows-correlated.rules.
references:
  - https://findingbad.blogspot.cz/2017/12/a-few-of-my-favorite-things-continued.html
  - https://thedfirreport.com/2025/01/27/cobalt-strike-and-a-pair-of-socks-lead-to-lockbit-ransomware/
author: sagan2sigma
logsource:
  product: windows
detection:
  selection_1:
    appname|cased: '*Security*'
  selection_2:
    EventID: 4688
  selection_3:
    _raw|contains|cased: \\WMIC.exe Token
  filter_4:
    _raw|contains|cased: '$ Account Domain:'
  condition: selection_1 and selection_2 and selection_3 and not filter_4
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.suspicious-command
custom_attributes:
  sagan.sid: '5003385'
  sagan.rev: '7'
  sagan.source_file: windows-correlated.rules
