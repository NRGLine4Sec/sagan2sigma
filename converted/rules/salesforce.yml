title: '[SALESFORCE] Failed Identity Verification Event Detected'
id: 773292d2-cc3e-5a0c-a34f-f74fb6eae8cf
status: experimental
description: Converted from Sagan rule SID 5014041 (rev 1), file salesforce.rules.
references:
  - https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_objects_monitoring.htm
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    syslog_appname|cased: salesforce_streaming_api_data
  selection_2:
    channel|cased: /event/IdentityVerificationEvent
  filter_3:
    data.payload.Status:
      - AutomatedSuccess
      - InProgress
      - Initiated
      - Succeeded
  condition: selection_1 and selection_2 and not filter_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.system-event
custom_attributes:
