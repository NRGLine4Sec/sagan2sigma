title: '[SALESFORCE] Possible Brute Force Failed Login Attempts [25/1] (threshold 5 in 5m)'
id: 801140c9-a595-598d-8b54-b42c5808e7da
status: experimental
description: Correlation derived from the Sagan after keyword. The base rule must not alert on its own.
correlation:
  type: event_count
  rules:
    - sagan_5014046
  group-by:
    - data.payload.SourceIp
  timespan: 5m
  condition:
    gte: 5
level: medium
