title: '[SALESFORCE] Anomalous API Activity from a User Detected'
id: e90a8d61-b091-5d33-bfa1-0e0617813cf1
status: experimental
description: Converted from Sagan rule SID 5014033 (rev 1), file salesforce.rules.
references:
  - https://developer.salesforce.com/docs/atlas.en-us.platform_events.meta/platform_events/platform_events_objects_monitoring.htm
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    syslog_appname|cased: salesforce_streaming_api_data
  selection_2:
    channel|cased: /event/ApiAnomalyEvent
  condition: selection_1 and selection_2
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.system-event
custom_attributes:
  sagan.sid: '5014033'
  sagan.rev: '1'
  sagan.source_file: salesforce.rules
