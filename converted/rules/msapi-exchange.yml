title: '[MSAPI-EXCHANGE] Admin Audit Inbox Rule w/ DeleteMessage'
id: 23c099a6-f7d5-570d-85f4-6c4a871eebcb
status: experimental
description: Converted from Sagan rule SID 5015500 (rev 2), file msapi-exchange.rules.
references:
  - https://redcanary.com/blog/threat-detection/email-forwarding-rules/
  - https://www.splunk.com/en_us/blog/security/hunting-m365-invaders-dissecting-email-collection-techniques.html
author: sagan2sigma
logsource:
  product: m365
detection:
  selection_1:
    appname|cased: Exchange
  selection_2:
    _raw|contains|cased:
      - '"Operation":"New-InboxRule'
      - '"Operation":"Set-InboxRule'
  selection_3:
    _raw|contains|cased:
      - Name\\":\\"DeleteMessage\\",\\"Value\\":\\"True
      - Name":"DeleteMessage","Value":"True
  condition: selection_1 and selection_2 and selection_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - attack.t1114
  - attack.ta0009
  - sagan.classtype.suspicious-activity
custom_attributes:
  sagan.sid: '5015500'
  sagan.rev: '2'
  sagan.source_file: msapi-exchange.rules
  sagan.metadata: created_at=2025_03_11,updated_at=2026_04_23
