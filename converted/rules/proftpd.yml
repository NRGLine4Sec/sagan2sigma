  selection_2:
    _raw|contains|cased:
      - apache
      - mysql
      - www
      - nobody
      - nogroup
      - portmap
      - named
      - rpc
      - mail
      - ftp
      - shutdown
      - halt
      - daemon
      - bin
      - postfix
      - shell
      - info
      - guest
      - psql
      - user
      - users
      - console
      - uucp
      - lp
      - sync
      - sshd
      - cdrom
      - ossec
      - sagan
