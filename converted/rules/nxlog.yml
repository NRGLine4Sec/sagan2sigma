title: '[NXLOG] Missing Windows Log Message (threshold 30 in 5m)'
id: 296a22da-793a-5283-8179-564ee3b8e4e4
status: experimental
description: Correlation derived from the Sagan after keyword. The base rule must not alert on its own.
correlation:
  type: event_count
  rules:
    - sagan_5003111
  group-by:
    - hostname
  timespan: 5m
  condition:
    gte: 31
level: medium
