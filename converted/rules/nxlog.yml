title: '[NXLOG] Missing Windows Log Message'
id: 1da55d02-c399-5ba5-9e0e-1d7980410837
name: sagan_5003111
status: experimental
description: Converted from Sagan rule SID 5003111 (rev 7), file nxlog.rules.
author: sagan2sigma
logsource:
  product: syslog
detection:
  selection_1:
    _raw|re: ' [0-9][0-9][0-9][0-9]?: $'
  selection_2:
    appname|cased:
      - '*Security*'
      - AppLocker
      - Application
      - Backup
      - Bonjour
      - CPQCISSE
      - Citrix
      - DAC
      - DHCP-Server
      - EMET
      - Eventlog
      - MSSQL*
      - MsiInstaller
      - NtFrs
      - Ntfs
      - RemoteAccess
      - Service
      - Service_Control_Manager
      - Symantec
      - Sysmon
      - System
      - USER32
      - Tenable
      - TermService
      - The
      - WinVNC4
      - crypt32
  condition: selection_1 and selection_2
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.program-error
custom_attributes:
  sagan.sid: '5003111'
  sagan.rev: '7'
  sagan.source_file: nxlog.rules
  rsigma.suppress: 1d
