title: '[NXLOG] Problem nxlog system has recovered (correlated with nxlog_problem)'
id: 124dd57d-d313-55e2-b0b7-6bafc3a969fd
status: experimental
description: Reconstruction of the Sagan 'nxlog_problem' bit. The window comes from the expire time declared
  by the rules that set the bit.
