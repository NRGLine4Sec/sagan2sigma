title: '[SENDMAIL] Username with pipe symbol'
id: b638f40d-a054-52ef-a971-7ee213645615
status: experimental
description: Converted from Sagan rule SID 5000357 (rev 6), file sendmail.rules.
references:
  - https://www.jochentopf.com/email/chars.html
author: sagan2sigma
logsource:
  product: sendmail
  service: smtp
detection:
  selection_1:
    _raw|contains|cased: to=<
  selection_2:
    _raw|contains|cased: '|'
  selection_3:
    _raw|re: to=<[A-Za-z0-9|&'*+-.=?^_{}~]+@\x2f
  selection_4:
    appname|cased:
      - sm-mta
      - sendmail
  condition: selection_1 and selection_2 and selection_3 and selection_4
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: high
tags:
  - sagan.classtype.exploit-attempt
custom_attributes:
  sagan.sid: '5000357'
  sagan.rev: '6'
  sagan.source_file: sendmail.rules
