title: '[BOX] Suspicious File Uploaded'
id: b99daa39-c43d-5c1e-b864-1a087d9cf329
status: experimental
description: Converted from Sagan rule SID 5015236 (rev 1), file box.rules.
references:
  - https://developer.box.com/guides/events/enterprise-events/for-enterprise/
author: sagan2sigma
logsource:
  product: box
detection:
  selection_1:
    syslog_appname|cased: box-api_data
  selection_2:
    event_type|cased: UPLOAD
  selection_3:
    source.item_name|contains|cased:
      - .exe"
      - .dll"
  condition: selection_1 and selection_2 and selection_3
falsepositives:
  - 'Unassessed: automatically converted, not yet tuned'
level: medium
tags:
  - sagan.classtype.suspicious-activity
custom_attributes:
  sagan.sid: '5015236'
  sagan.rev: '1'
  sagan.source_file: box.rules
