# Profile: Vector consumes syslog and forwards JSON to RSigma.
#
# Field names from Vector's `syslog` source and its VRL parse_syslog()
# function: appname, hostname, host, message, facility, severity, procid,
# msgid, timestamp, version.
name: vector-json
description: >-
  Vector parses syslog and emits a JSON object. The message body is exposed as
  message, not as _raw.
fields:
  message: message
  program: appname
  syslog_host: hostname
  facility: facility
  level: severity
# Vector emits one flat JSON object either way, so the envelope keeps the same
# names whether or not the body was itself JSON.
#
# That holds only as long as your pipeline does not lift a JSON body's keys to
# the top level. If it does, the body and the envelope share one namespace and
# one of them loses: measured with Vector 0.39, a body carrying its own
# `severity` is overwritten by the syslog severity, and 131 rules of the
# upstream corpus match on exactly that key. A pipeline that flattens the body
# should rename the envelope to syslog_appname / syslog_hostname /
# syslog_facility / syslog_severity, as data/vrl/sagan-json.vrl does for the
# vector-enriched profile, and use that profile instead of this one.
json_envelope: {}

notes:
  - >-
    Vector also exposes `host`, which equals hostname when the syslog envelope
    carries one and the peer address otherwise. The profile keeps hostname,
    which is closer to Sagan's syslog_host semantics.
