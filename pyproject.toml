[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sagan2sigma"
version = "0.1.0"
description = "Convert Sagan rules (Snort/Suricata syntax) into Sigma rules, with a full conversion report"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sagan2sigma contributors" }]
keywords = ["sagan", "sigma", "siem", "detection", "rules", "conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
    # 1.0 is the first release whose correlation support this tool relies on
    # actually imports cleanly. 0.11.0 fails on a pyparsing incompatibility and
    # 0.11.20 rejects constructs the converter emits, so the floor is not
    # cosmetic. The minimum-versions CI job pins it.
    "pysigma>=1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/NRGLine4Sec/sagan2sigma"
Repository = "https://github.com/NRGLine4Sec/sagan2sigma"
Issues = "https://github.com/NRGLine4Sec/sagan2sigma/issues"
Changelog = "https://github.com/NRGLine4Sec/sagan2sigma/blob/main/CHANGELOG.md"

[project.scripts]
sagan2sigma = "sagan2sigma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagan2sigma"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sagan2sigma"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",       # ruff-specific
    "D",         # pydocstyle
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D401",   # imperative mood is not always the clearest phrasing here
    "N818",   # Refusal is a control-flow signal carrying a stable code, not an
              # error condition; naming it RefusalError would misdescribe it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
# The differential fixtures are Sagan rule lines. Wrapping them would make them
# unreadable and would no longer resemble what a real .rules file contains.
"tests/differential/test_differential.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/sagan2sigma"]

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true
